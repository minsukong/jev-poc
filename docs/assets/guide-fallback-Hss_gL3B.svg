<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 610 342"><title id="title">Java 추천 서비스의 분기</title><desc id="desc">후보가 없으면 즉시 빈 목록을 반환합니다. 후보가 있으면 기준 순위를 준비하고 공급자 어댑터를 호출합니다. 성공하면 점수 순위를, 실패하면 기준 순위를 반환합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#58616a"/></marker></defs><style>text{font-family:'Pretendard GOV','Malgun Gothic',sans-serif;fill:#1e2124}.title{font-size:19px;font-weight:700}.note{font-size:15px}.edge{fill:none;stroke:#58616a;stroke-width:1.7;marker-end:url(#arrow)}</style><rect x="12" y="12" width="269" height="69" rx="8" fill="#fff" stroke="#a9b4c4"/><text x="146.5" y="39" class="title" text-anchor="middle">이용 조건 필터</text><text x="146.5" y="62" class="note" text-anchor="middle">후보가 있습니까?</text><path class="edge" d="M281 46H326"/><rect x="329" y="12" width="268" height="69" rx="8" fill="#fff" stroke="#a9b4c4"/><text x="463" y="39" class="title" text-anchor="middle">후보 없음</text><text x="463" y="62" class="note" text-anchor="middle">빈 목록 반환 · 외부 호출 0회</text><path class="edge" d="M146 81V120"/><rect x="12" y="124" width="269" height="69" rx="8" fill="#fff" stroke="#a9b4c4"/><text x="146.5" y="151" class="title" text-anchor="middle">후보 있음</text><text x="146.5" y="174" class="note" text-anchor="middle">규칙 기반 순위를 먼저 계산</text><path class="edge" d="M281 158H326"/><rect x="329" y="124" width="268" height="69" rx="8" fill="#ecf2fe" stroke="#256ef4"/><text x="463" y="151" class="title" text-anchor="middle">DecisionProvider</text><text x="463" y="174" class="note" text-anchor="middle">Jev 호출 · 응답 검증</text><path class="edge" d="M420 193V216H147V257"/><path class="edge" d="M503 193V216H464V257"/><rect x="12" y="260" width="269" height="69" rx="8" fill="#ecf2fe" stroke="#256ef4"/><text x="146.5" y="287" class="title" text-anchor="middle">정상 응답</text><text x="146.5" y="310" class="note" text-anchor="middle">적합도순으로 반환</text><rect x="329" y="260" width="268" height="69" rx="8" fill="#fff" stroke="#a9b4c4"/><text x="463" y="287" class="title" text-anchor="middle">시간 초과 · 오류</text><text x="463" y="310" class="note" text-anchor="middle">준비한 규칙 순위 반환</text></svg>
