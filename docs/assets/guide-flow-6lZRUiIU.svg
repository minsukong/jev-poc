<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 610 333"><title id="title">항공편에서 추천 상품까지</title><desc id="desc">화면이 편명을 보내면 백엔드가 운항편을 조회하고 상품을 필터링합니다. Jev가 남은 상품에 점수를 매기면 서버가 순위를 반환합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#58616a"/></marker></defs><style>text{font-family:'Pretendard GOV','Malgun Gothic',sans-serif;fill:#1e2124}.title{font-size:19px;font-weight:700}.note{font-size:15px}.edge{fill:none;stroke:#58616a;stroke-width:1.7;marker-end:url(#arrow)}</style><rect x="10" y="10" width="267" height="69" rx="8" fill="#fff" stroke="#a9b4c4"/><text x="143.5" y="37" class="title" text-anchor="middle">고객 화면</text><text x="143.5" y="60" class="note" text-anchor="middle">출발일 · 항공편명</text><rect x="328" y="10" width="267" height="69" rx="8" fill="#fff" stroke="#a9b4c4"/><text x="461.5" y="37" class="title" text-anchor="middle">인천공항 API</text><text x="461.5" y="60" class="note" text-anchor="middle">터미널 · 탑승구 · 출발 시각</text><path class="edge" d="M143 79V102H217V126"/><path class="edge" d="M461 79V102H387V126"/><rect x="150" y="129" width="307" height="69" rx="8" fill="#ecf2fe" stroke="#256ef4"/><text x="303.5" y="156" class="title" text-anchor="middle">추천 백엔드</text><text x="303.5" y="179" class="note" text-anchor="middle">상품 이용 조건 확인 · 후보 구성</text><path class="edge" d="M206 198V221H143V245"/><rect x="10" y="248" width="267" height="69" rx="8" fill="#ecf2fe" stroke="#256ef4"/><text x="143.5" y="275" class="title" text-anchor="middle">Jev</text><text x="143.5" y="298" class="note" text-anchor="middle">후보별 적합도 평가</text><path class="edge" d="M277 283H325"/><rect x="328" y="248" width="267" height="69" rx="8" fill="#fff" stroke="#a9b4c4"/><text x="461.5" y="275" class="title" text-anchor="middle">백엔드 → 고객 화면</text><text x="461.5" y="298" class="note" text-anchor="middle">점수 정렬 · 상품 정보 표시</text></svg>
